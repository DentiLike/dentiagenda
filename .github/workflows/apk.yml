name: Compilar APK
on:
  push:
    branches: [android]
    paths-ignore: ['apk/**']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'
      - name: Compilar
        working-directory: android
        run: |
          set +e
          gradle assembleRelease --no-daemon --stacktrace > ../build.log 2>&1
          echo $? > ../exit.txt
      - name: Guardar el APK (o el error) en la rama
        run: |
          mkdir -p apk
          grep -E "^e: |error:|FAILURE|What went wrong|Could not|BUILD " build.log | head -80 > apk/errores.txt || true
          tail -c 40000 build.log > apk/build-log.txt
          if [ "$(cat exit.txt)" = "0" ]; then
            cp android/app/build/outputs/apk/release/app-release.apk apk/DentiAgenda.apk
            echo "OK $(date -u +%FT%TZ)" > apk/estado.txt
          else
            echo "FALLO $(date -u +%FT%TZ)" > apk/estado.txt
          fi
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add apk
          git commit -m "Resultado de compilación [skip ci]" || true
          git push
